name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + Swatinem/rust-cache (enabled by default): a warm run
      # compiles in seconds instead of a cold minute-plus.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The test suite is the merge gate: PRs here can merge textually clean
      # yet break semantically (new enum/struct fields demanded by main, new
      # fixtures demanded by the PR) — exactly what a green `cargo test`
      # catches.
      - run: cargo test
